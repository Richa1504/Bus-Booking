<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passenger Details</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script defer src="js/passenger.js"></script>
</head>
<body>
  <h2>Passenger Details</h2>

  <form id="passengerForm">
    <label>Name: <input type="text" id="name" required /></label>
    <label>Age: <input type="number" id="age" required min="1" /></label>
    <label>Gender:
      <select id="gender" required>
        <option value="">Select</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </label>
    <label>Email: <input type="email" id="email" required /></label>
    <label>Phone: <input type="tel" id="phone" required pattern="[0-9]{10}" /></label>

    <button type="submit">Confirm Booking</button>
  </form>

  <!-- Review Section -->
  <div id="review">
    <h3>Review Booking</h3>
    <p><strong>Bus:</strong> <span id="busName"></span></p>
    <p><strong>Seats:</strong> <span id="seatNumbers"></span></p>
    <p><strong>Total Fare:</strong> ₹<span id="fareAmount"></span></p>
  </div>
</body>
</html>
