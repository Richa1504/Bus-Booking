<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Available Buses</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script defer src="js/buses.js"></script>
</head>
<body>
  <h1>Available Buses</h1>

  <!-- Filters -->
  <div id="filters">
    <label>Price Range:
      <input type="range" id="priceFilter" min="0" max="5000" step="100" />
      <span id="priceValue">2500</span>
    </label>
    <!-- Add type and time filters similarly -->
  </div>

  <!-- Bus List -->
  <div id="busList"></div>

  <!-- Loader -->
  <div id="loading" style="display: none;">Loading buses...</div>
</body>
</html>
